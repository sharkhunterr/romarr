    name: "Nintendo Entertainment System"
    short_name: "NES"
    manufacturer: Nintendo
    generation: 3
    release_year: 1983
    is_handheld: false
    is_disc_based: false
    metadata_ids:
      igdb_id: 18
      screenscraper_id: 3
      mobygames_id: 22
      retroachievements_id: 7
    formats:
