pack_version: "2026.04.001"
schema_version: 1
description: "Romarr built-in platform pack — 20 MVP consoles + handhelds covering the Romarr launch catalog."
author: "Romarr"
source_url: "https://romarr.example/packs/builtin"

parsing_strategies:
  - id: ines-header
    description: "iNES (.nes) header sniff"
    regex: "^NES\\x1A"
    apply_to_platforms: ["nes"]
  - id: snes-header
    description: "Super Nintendo (.smc/.sfc) header"
    regex: "^.{0,512}SUPER\\s*NES"
    apply_to_platforms: ["snes"]
  - id: megadrive-header
    description: "Mega Drive ROM header"
    regex: "^.{0,256}SEGA"
    apply_to_platforms: ["megadrive"]
  - id: gameboy-header
    description: "Game Boy / GBC ROM header sniff"
    regex: "^.{0,335}NINTENDO"
    apply_to_platforms: ["gameboy", "gbc"]
  - id: iso9660
    description: "Generic ISO9660 disc filesystem"
    regex: "^.{0,33000}CD001"
    apply_to_platforms: ["psx", "saturn", "dreamcast", "gamecube", "wii", "ps2"]

platforms:
