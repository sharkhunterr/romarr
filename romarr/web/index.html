<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG en priorité (rendu net à toute taille), PNG en fallback
         pour les clients qui n'ingèrent pas le SVG (vieux browsers,
         panels Unraid, agrégateurs *arr, etc.). L'ordre importe : le
         browser prend le premier qu'il comprend. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="application-name" content="Romarr" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Romarr" />
    <title>Romarr</title>

    <!-- No-flash theme application (T040, FR-013). Runs BEFORE
         React hydrates so the very first paint already has the
         right ``class="dark"`` toggle. The persisted choice
         lives under THEME_STORAGE_KEY = "romarr.theme" (matches
         src/lib/store/theme.ts). Default = "dark" per the
         constitution. -->
    <script>
      (function () {
        try {
          var key = "romarr.theme";
          var raw = localStorage.getItem(key);
          var theme = "dark";
          if (raw) {
            try {
              theme = (JSON.parse(raw).state || {}).theme || "dark";
            } catch (e) {
              theme = "dark";
            }
          }
          var resolved = theme;
          if (theme === "auto") {
            resolved = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          var html = document.documentElement;
          html.classList.toggle("dark", resolved === "dark");
          html.classList.toggle("light", resolved === "light");
        } catch (e) {
          // localStorage unavailable (incognito / blocked) — keep
          // the static class="dark" attribute.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
