# Romarr development stack.
#
#   Romarr   → http://localhost:8585  (frontend + API + WebSocket)
#   Prowlarr → http://localhost:9696  (indexer aggregator)
#   qBittorrent → http://localhost:8088  (torrent client; remapped
#                                          from the default 8080 to
#                                          dodge a host-level
#                                          conflict)
#
# First-boot:
#   1. docker compose up -d
#   2. docker compose logs romarr | grep setup_token  ← capture the WARNING line
#   3. open http://localhost:8585/setup, paste the token, create admin
#   4. http://localhost:9696 → Prowlarr setup wizard
#   5. http://localhost:8080 → admin / adminadmin (default qBit creds; change!)
#
# Shared volumes (slice 375):
#   * ``./data/downloads`` is mounted at ``/downloads`` on BOTH qBit
#     and Romarr so the importer's watcher can read the files qBit
#     drops there. qBit's "save path" stays ``/downloads`` inside
#     its container; Romarr sees the exact same absolute path
#     because it's the same mount target.
#   * ``./data/library`` is mounted at ``/library`` on Romarr —
#     create one Library row per platform whose ``path`` points
#     under ``/library`` (e.g. ``/library/gba``) and the importer
#     will hardlink/move ROMs there.
#
# Persistence: every container's state lives under ./data/<service>/
# (auto-created). Wipe with `docker compose down --volumes -v`.

services:
  romarr:
    build: .
    image: romarr:dev
    container_name: romarr
    restart: unless-stopped
    ports:
      - "8585:8585"
    environment:
      # REQUIRED — Fernet master key for stored credentials.
      # Kept in sync with the dev .env so the compose stack
      # opens the same database the local ``romarr serve``
      # writes to (slice 376 — same key derives the same
      # Fernet, otherwise existing rows decode garbage).
      ROMARR_AUTH_SECRET_KEY: "dev-only-do-not-use-in-prod-replace-with-32-chars-please"
      # Lifespan toggles (Dockerfile defaults already set these but explicit
      # here makes overrides obvious).
      ROMARR_BOOTSTRAP_ENABLED: "true"
      ROMARR_AUTO_MIGRATE: "true"
      ROMARR_SCHEDULER_ENABLED: "true"
      ROMARR_SPA_ENABLED: "true"
      # Slice 375 — turn the importer's poll watcher + queue
      # reconciler on so qBit-completed downloads actually
      # surface in Activity → Queue and trigger the import
      # pipeline without a manual refresh.
      ROMARR_IMPORTER_WATCHER_ENABLED: "true"
      # Logging — bumped to INFO so the setup-token mint surfaces.
      PYTHONUNBUFFERED: "1"
    volumes:
      # Slice 376 — share the entire ``./data`` dir with the
      # container so ``romarr.db`` / ``covers/`` / etc. are the
      # SAME files the dev ``romarr serve`` reads. Either
      # process can run at any one time; never both at once
      # (SQLite locks).
      - ./data:/data
      # Shared with qBit so the importer can read what qBit
      # writes — the absolute path is identical inside both
      # containers (``/downloads/<file>``).
      - ./data/downloads:/downloads
      # Library destination — point a Library row's ``path`` at
      # ``/library/<platform-slug>`` and the importer hardlinks
      # the ROM here once the match resolves.
      - ./data/library:/library
    depends_on:
      - prowlarr
      - qbittorrent

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: romarr-prowlarr
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "UTC"
    ports:
      - "9696:9696"
    volumes:
      - ./data/prowlarr:/config

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: romarr-qbittorrent
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "UTC"
      WEBUI_PORT: "8080"
    ports:
      # Host 8088 → container 8080 — port 8080 is commonly
      # taken on dev hosts (other qBit / Sonarr / random
      # service). Inside the docker network, Romarr still
      # talks to qBit on 8080 via the ``qbittorrent`` hostname.
      - "8088:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./data/qbittorrent:/config
      - ./data/downloads:/downloads
