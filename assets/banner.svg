<?xml version="1.0" encoding="UTF-8"?>
<!--
  Romarr README banner — 1280x360. The cartridge badge on the left,
  the "Rom·arr" wordmark + tagline on the right. Game Boy LCD-green
  identity on a dark field.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10160c"/>
      <stop offset="1" stop-color="#070806"/>
    </linearGradient>
    <radialGradient id="bglow" cx="0.16" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#9BBC0F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9BBC0F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bcart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B6CE3F"/>
      <stop offset="0.55" stop-color="#9BBC0F"/>
      <stop offset="1" stop-color="#7E9B0C"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#bglow)"/>

  <!-- Cartridge badge, scaled from the 512 icon -->
  <g transform="translate(64,52) scale(0.5)">
    <rect width="512" height="512" rx="114" fill="#141d10"/>
    <path d="M 170 92 L 302 92 L 364 154 L 364 398 Q 364 420 342 420
             L 170 420 Q 148 420 148 398 L 148 114 Q 148 92 170 92 Z"
          fill="url(#bcart)" stroke="#D7E78A" stroke-width="3" stroke-opacity="0.55"/>
    <path d="M 302 92 L 364 154" fill="none"
          stroke="#5F7409" stroke-width="6" stroke-linecap="round"/>
    <rect x="176" y="128" width="160" height="172" rx="14" fill="#EEF3D2"/>
    <g fill="#3E4D06">
      <rect x="206" y="144" width="18" height="18" rx="3"/>
      <rect x="226" y="144" width="18" height="18" rx="3"/>
      <rect x="246" y="144" width="18" height="18" rx="3"/>
      <rect x="266" y="144" width="18" height="18" rx="3"/>
      <rect x="206" y="164" width="18" height="18" rx="3"/>
      <rect x="286" y="164" width="18" height="18" rx="3"/>
      <rect x="206" y="184" width="18" height="18" rx="3"/>
      <rect x="286" y="184" width="18" height="18" rx="3"/>
      <rect x="206" y="204" width="18" height="18" rx="3"/>
      <rect x="226" y="204" width="18" height="18" rx="3"/>
      <rect x="246" y="204" width="18" height="18" rx="3"/>
      <rect x="266" y="204" width="18" height="18" rx="3"/>
      <rect x="206" y="224" width="18" height="18" rx="3"/>
      <rect x="246" y="224" width="18" height="18" rx="3"/>
      <rect x="206" y="244" width="18" height="18" rx="3"/>
      <rect x="266" y="244" width="18" height="18" rx="3"/>
      <rect x="206" y="264" width="18" height="18" rx="3"/>
      <rect x="286" y="264" width="18" height="18" rx="3"/>
    </g>
    <g fill="#5F7409">
      <rect x="185" y="324" width="22" height="76" rx="8"/>
      <rect x="225" y="324" width="22" height="76" rx="8"/>
      <rect x="265" y="324" width="22" height="76" rx="8"/>
      <rect x="305" y="324" width="22" height="76" rx="8"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="372" y="194" font-family="'DejaVu Sans','Verdana',sans-serif"
        font-size="118" font-weight="700" letter-spacing="-2">
    <tspan fill="#EEF3D2">Rom</tspan><tspan fill="#9BBC0F">arr</tspan>
  </text>

  <!-- Tagline -->
  <text x="376" y="244" font-family="'DejaVu Sans','Verdana',sans-serif"
        font-size="26" font-weight="400" fill="#A8C338">
    Self-hosted ROM acquisition manager for the *arr ecosystem
  </text>

  <!-- Pixel accent row -->
  <g fill="#9BBC0F">
    <rect x="376" y="280" width="16" height="16" rx="3" fill-opacity="0.95"/>
    <rect x="400" y="280" width="16" height="16" rx="3" fill-opacity="0.7"/>
    <rect x="424" y="280" width="16" height="16" rx="3" fill-opacity="0.45"/>
    <rect x="448" y="280" width="16" height="16" rx="3" fill-opacity="0.25"/>
  </g>
  <text x="480" y="293" font-family="'DejaVu Sans','Verdana',sans-serif"
        font-size="20" font-weight="400" fill="#5F7409">
    DAT-verified · profile scoring · Torznab
  </text>
</svg>
